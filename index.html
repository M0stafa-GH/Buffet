<style>
:root{--bg:#EEF3F1;--sf:#fff;--ink:#12302B;--mut:#5F7872;--pri:#0E6B5B;--on:#fff;--ln:#D3DFDB;--bad:#C2312D;--ok:#1B7F4B}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A18;--sf:#182724;--ink:#E4F0EC;--mut:#8FAAA3;--pri:#3FBFA6;--on:#06201B;--ln:#2A3F3B;--bad:#FF7A72;--ok:#5FD08F}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 18px/1.4 Cairo,Tahoma,Arial,sans-serif;padding-top:env(safe-area-inset-top,0)}
header{padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--sf);border-bottom:1px solid var(--ln)}
h1{font-size:20px;font-weight:800;margin:0}
input,button,textarea{font-family:inherit}
.in{font-size:17px;padding:10px 12px;border:1.5px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--ink);width:100%;margin-bottom:10px}
main{flex:1;overflow-y:auto;padding:10px 12px 20px;max-width:900px;width:100%;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{font:600 17px Cairo,sans-serif;padding:10px 16px;border-radius:999px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);min-height:48px}
.chip.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--sf);border-bottom:1px solid var(--ln)}
.row.has{box-shadow:inset -5px 0 0 var(--pri)}
.nm{flex:1;font-weight:600}.sub{display:block;font-size:14px;font-weight:400;color:var(--mut)}
.st{display:flex;align-items:center;gap:6px}
.b{width:54px;height:54px;border-radius:14px;border:0;font:800 28px Cairo,sans-serif;background:var(--pri);color:var(--on)}
.b.m{background:var(--bg);color:var(--ink);border:1.5px solid var(--ln)}
.q{width:64px;height:54px;text-align:center;font:800 22px Cairo,sans-serif;border:1.5px solid var(--ln);border-radius:14px;background:var(--bg);color:var(--ink);padding:0}
.q.w{width:96px}.q.s{width:56px;height:42px;font-size:18px}
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 15px Cairo,sans-serif;padding:14px 4px;min-height:60px}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
.bad{color:var(--bad);font-weight:800}.ok{color:var(--ok);font-weight:800}
.act{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{font:600 17px Cairo,sans-serif;padding:12px 18px;border-radius:12px;border:1.5px solid var(--pri);background:var(--pri);color:var(--on);min-height:48px}
.btn.o{background:none;color:var(--pri)}.btn.d{background:none;border-color:var(--bad);color:var(--bad)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:18px}
.ln{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--ln)}
.rt{display:grid;grid-template-columns:1fr 64px 64px 84px;gap:6px;align-items:center;padding:8px 10px;background:var(--sf);border-bottom:1px solid var(--ln)}
.rt.h{font-weight:800;color:var(--mut);font-size:15px}.rt span:not(:first-child){text-align:center}
.rt6{grid-template-columns:1fr repeat(5,48px);font-size:15px}.rt2{grid-template-columns:1fr 80px}.sendbar{position:sticky;bottom:0;padding:10px 0;background:var(--bg)}
.sendbar .btn{width:100%;font-size:20px;min-height:58px}
.tag{font-size:14px;padding:2px 10px;border-radius:999px;border:1px solid var(--ln);color:var(--mut)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}
#t{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none}#t.on{opacity:1}
.em{padding:26px 10px;text-align:center;color:var(--mut)}

const ITEMS=["شاى فتله ليبتون", "شاء فتلة بحليب", "شاى فتله كرك", "سحلب", "اعشاب", "قهوة تركى عادية", "قهوة فرنساوى", "قهوة ابو عوف", "كابتشينو", "نسكافية كلاسيك", "نسكافية لبن", "كوفى ميكس", "لبن سادة", "اضافه لبن", "كنز كوكا كولا", "كنز جيب", "عصير علب", "اسبيرو اسباتيس", "فيورى", "عصير هيلثى", "دبل دير", "زبادو", "بريل", "فيروز", "رانى", "فروتس", "فيو كولا", "هيلثى كولا", "ريد بول", "كانز تويست", "مياه 6", "مياه 7", "بيك رولز", "بيك رولز كبير", "ويندز", "شيبسى بانواعه 11", "شيبسى بانواعه 16", "بريك كبير", "شيتوس 11", "دوريتوس 8", "دوريتوس 11", "بريك", "جاجوار 11", "جاجوار 16", "صن بايتس16", "صن بايتس 11", "فلامنكو كبير", "فلامنكو صغير", "شيبسى توست", "بسكوت اولكر ساده", "بسكوت اولكر عجوه", "بسكوت اولكر كبير", "مولتو كينج", "مولتو كبير", "مولتو مينى", "فريسكا", "فريسكا كبيره", "هوهوز", "هوهوز ميكس", "توينكز", "توينكز ميكس", "تودو", "بسكوت اونيرو", "بسكوت اونيرو كبير", "بسكوت معمول", "بسكوت شاى", "بسكوت لوكس", "بسكوت كوكا", "بسكوت داتو", "بسكوت هالى", "بسكوت شوفان كبير", "بسكوت شوفان شيكولاته", "بسكوت شوفان ساده", "بسكوت نايس", "دولشى", "بسكوت ويفر", "بسكريم صغير", "بسكريم كبير", "لمبادا 7", "لمبادا فامليي 12", "كيك دورو 12", "كيك دورو 15", "هوهوز كبير اوووي", "اوريو", "شيكولاته ديرى ميلك", "شيكولاته مورو", "بابلي", "كتاكيتو", "لاراش", "شوجر", "شكولاتة تويكس45", "بالاكس", "جلاكسي", "بلوكس 7", "بلوكس 12", "كتكات 2", "كتكات", "تاو تاو", "سي كمارا", "بسكوت سادة", "شوكلاتة سي كمارا", "باتية", "مخبوزات ب 20", "مخبوزات ب 25", "ريتس", "جي كولا", "ديلينو", "توريكس", "براندبيت", "مارشيملو 11", "ساندوتش فول", "ساندوتش طعمية", "ساندوتش بطاطس", "ساندوتش لانشون دجاج", "ساندوتش لانشون لحم", "ساندوتش جبنه رومى", "ساندوتش جبنه فيتا", "ساندوتش بابا غنوج", "ساندوتش بيض مسلوق", "ساندوتش بيض اومليت", "ساندوتش ميكس", "ساندوتش حلاوة بالقشطة", "طبق فول", "طبق بطاطس", "قرس طعمية", "بيضه مسلوقه", "علبه سلطه", "فول اسكندرانى", "طبق فيتا", "رغيف عيش شامى", "رغيف عيش بلدى", "مسقعة باللحمة المفرومة", "ساندوتش مسقعه", "بطاطس مهروسه", "لانشون على رومى", "اومليت علي رومي", "بطاطس علي رومي", "بيض بالبسطرمة", "مربي", "وجبة فاهيتا", "كبدة", "شيش", "استريبس", "نجرسكو", "كفتة", "حواوشي", "نص فرخة", "بيتزا فراخ", "ربع فرخة", "سجق", "وجبه بوكس", "بشامل", "برجر بالبيض", "برجر سادة", "وجبة شيش", "فيلية", "فاهيتا", "شاورما", "هوت دوج"];
const FL=['الثاني','الثالث','الرابع','الخامس','السادس','السابع','كافيتيريا'];
const OUT=FL.concat(['خارجي','هالك']);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const toast=x=>{const t=$('t');t.textContent=x;t.className='on';setTimeout(()=>t.className='',2000)};
const chips=(l,cur,a)=>'<div class="chips">'+l.map(x=>`<button class="chip${x[0]===cur?' on':''}" data-${a}="${x[0]}">${x[1]}</button>`).join('')+'</div>';
const ADM=location.hash==='#admin';
const ADMIN_EMAIL='mostafa.amer05.ma@gmail.com';
addEventListener('hashchange',()=>location.reload());
let db,auth,U=null;
try{const app=initializeApp(CFG);auth=getAuth(app);db=getFirestore(app)}catch(e){$('m').innerHTML='<div class="em">إعدادات Firebase ناقصة. راجع ملف README.</div>'}
const busy=()=>/INPUT|TEXTAREA/.test(document.activeElement.tagName);
let idle=null;const later=f=>{idle=f;if(!busy())f()};
document.addEventListener('focusout',()=>setTimeout(()=>{if(idle&&!busy()){const f=idle;idle=null;f()}},150));
if(auth)onAuthStateChanged(auth,u=>{U=u;if(!u&&!ADM){signInAnonymously(auth).catch(()=>$('m').innerHTML='<div class="em">فعّل Anonymous في Authentication.</div>');return}
 ADM?adminStart():empStart()});

/* ================= الموظف ================= */
let P=null,C={},myOrders=[],q='',unsubE=null,STF=[],LS={f:'',id:''};
async function empStart(){
 if(unsubE){unsubE();unsubE=null}
 P=null;
 if(U&&!U.isAnonymous){
  try{const s=await getDoc(doc(db,'staff',U.uid));if(s.exists())P=s.data()}catch(e){}
  if(!P){await signOut(auth);return}
  unsubE=onSnapshot(query(collection(db,'orders'),where('uid','==',U.uid)),s=>{myOrders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||9e9)-(a.createdAt?.seconds||9e9)).slice(0,6);later(emp)},()=>{});
  emp();return}
 try{const s=await getDocs(collection(db,'staff'));STF=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){STF=[]}
 loginView()}
function loginView(){
 $('ti').textContent='دخول الموظفين';$('hx').innerHTML='';
 const L=STF.filter(x=>x.floor===LS.f).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
 let h='<p>انت في أنهي دور؟</p>'+chips(FL.map(x=>[x,x==='كافيتيريا'?x:'دور '+x]),LS.f,'lf');
 if(LS.f)h+=L.length?'<p>اختار اسمك</p>'+chips(L.map(x=>[x.id,esc(x.name)]),LS.id,'ls')+(LS.id?'<input class="in" id="lpin" type="password" inputmode="numeric" placeholder="الرقم السري" dir="ltr"><button class="btn" id="lg" style="width:100%">دخول</button>':''):'<div class="em">مفيش أسماء متسجلة في الدور ده. كلم المدير.</div>';
 $('m').innerHTML=h}
function emp(){
 const m=$('m');$('ti').textContent='طلب من البوفيه';
 $('hx').innerHTML=`<span>${esc(P.name)} · ${P.floor==='كافيتيريا'?P.floor:'دور '+esc(P.floor)}</span> <button class="chip" id="lo2" style="min-height:40px;padding:6px 12px">خروج</button>`;
 const n=Object.values(C).reduce((a,b)=>a+b,0);
 let h='<input class="in" id="sq" type="search" placeholder="ابحث عن صنف" value="'+esc(q)+'">';
 const L=ITEMS.map((x,i)=>[x,i]).filter(x=>!q.trim()||x[0].includes(q.trim()));
 h+=L.length?L.map(([x,i])=>`<div class="row${C[i]?' has':''}"><span class="nm">${esc(x)}</span><span class="st"><button class="b" data-a="1" data-i="${i}">+</button><input class="q" inputmode="numeric" data-n="${i}" value="${C[i]||''}" placeholder="0"><button class="b m" data-a="-1" data-i="${i}">−</button></span></div>`).join(''):'<div class="em">مفيش صنف بالاسم ده</div>';
 h+=`<div class="sendbar"><button class="btn" id="send"${n?'':' disabled'}>${n?'إرسال الطلب ('+n+' قطعة)':'اختار الأصناف الأول'}</button></div>`;
 if(myOrders.length)h+='<h3>طلباتك الأخيرة</h3>'+myOrders.map(o=>{const st={pending:['بانتظار التأكيد',''],confirmed:['تم التأكيد','ok'],rejected:['مرفوض','bad']}[o.status]||['',''];return`<div class="card"><span class="tag ${st[1]}">${st[0]}</span> <small>${o.date}</small><div>${Object.entries(o.items||{}).map(([i,v])=>esc(ITEMS[i])+' × '+v).join('، ')}</div></div>`}).join('');
 const sc=m.scrollTop;m.innerHTML=h;m.scrollTop=sc;
 const sq=$('sq');sq.oninput=()=>{q=sq.value;const p=sq.selectionStart;emp();const z=$('sq');z.focus();z.setSelectionRange(p,p)}}
async function sendOrder(){
 const items={};Object.entries(C).forEach(([i,v])=>{if(v>0)items[i]=v});if(!Object.keys(items).length)return;
 $('send').disabled=true;
 try{await addDoc(collection(db,'orders'),{uid:U.uid,name:P.name,floor:P.floor,items,status:'pending',date:iso(new Date()),createdAt:serverTimestamp()});C={};toast('تم إرسال الطلب ✓');emp()}
 catch(e){toast('فشل الإرسال، اتأكد من النت');$('send').disabled=false}}

/* ================= الأدمن ================= */
let STAFF=[],ORD=[],LED={},S={pm:'w',rf:'all',tab:'ord',d:iso(new Date()),mode:'in',dest:'الثاني',ct:'count',q:'',only:false},recs=null,unsubs=[];
const TABS=[['ord','الطلبات'],['mv','صرف/استلام'],['cnt','جرد'],['rep','التقرير'],['stf','الموظفين']];
function adminStart(){
 unsubs.forEach(f=>f());unsubs=[];
 if(!U||U.email!==ADMIN_EMAIL){$('nv').hidden=true;$('m').innerHTML='<h2>دخول الأدمن</h2><input class="in" id="em" type="email" placeholder="الإيميل" dir="ltr"><input class="in" id="pw" type="password" placeholder="كلمة السر" dir="ltr"><button class="btn" id="li" style="width:100%">دخول</button>';return}
 $('nv').hidden=false;$('hx').innerHTML='<input class="in" type="date" id="dt" style="width:auto;margin:0" value="'+S.d+'"> <button class="chip" id="lo">خروج</button>';
 unsubs.push(onSnapshot(collection(db,'orders'),s=>{ORD=s.docs.map(d=>({id:d.id,...d.data()}));recs=null;later(adm)},e=>toast('لا توجد صلاحية (راجع القواعد)')));
 unsubs.push(onSnapshot(collection(db,'ledger'),s=>{LED={};s.docs.forEach(d=>LED[d.id]=d.data());recs=null;later(adm)}));
 unsubs.push(onSnapshot(collection(db,'staff'),s=>{STAFF=s.docs.map(d=>({id:d.id,...d.data()}));later(adm)},()=>{}));
 adm()}
const lid=(t,de,i)=>[t,de,S.d,i].join('|');
function R(){if(!recs){recs=Object.values(LED).map(r=>({t:r.t,de:r.de||'',d:r.d,i:r.i,q:r.q}));ORD.filter(o=>o.status==='confirmed').forEach(o=>Object.entries(o.items||{}).forEach(([i,v])=>recs.push({t:'out',de:o.floor,d:o.date,i:+i,q:v})))}return recs}
function calc(i,up){let od='',ob=0;const rs=R().filter(r=>r.i===i&&r.d<=up);rs.forEach(r=>{if(r.t==='open'&&r.d>=od){od=r.d;ob=r.q}});let s=ob;rs.forEach(r=>{if(r.d<od)return;if(r.t==='in')s+=r.q;else if(r.t==='out')s-=r.q});return s}
function lastCount(i){let od='',b=null;R().forEach(r=>{if(r.i===i&&r.t==='open'&&r.d<=S.d&&r.d>od)od=r.d});R().forEach(r=>{if(r.i===i&&r.t==='count'&&r.d<=S.d&&r.d>=od&&(!b||r.d>b.d))b=r});return b}
async function put(t,de,i,v){const id=lid(t,de,i);if(v===''||isNaN(v)||((t==='out'||t==='in')&&v<=0)){delete LED[id];recs=null;await deleteDoc(doc(db,'ledger',id))}else{LED[id]={t,de,d:S.d,i,q:v};recs=null;await setDoc(doc(db,'ledger',id),{t,de,d:S.d,i,q:v})}}
const getL=(t,de,i)=>{const r=LED[lid(t,de,i)];return r?r.q:0};
function adm(){
 if(!U||U.email!==ADMIN_EMAIL)return;
 $('ti').textContent='لوحة الأدمن';
 const pend=ORD.filter(o=>o.status==='pending').length;
 $('nv').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" class="${S.tab===t[0]?'on':''}">${t[1]}${t[0]==='ord'&&pend?' ('+pend+')':''}</button>`).join('');
 const m=$('m'),sc=m.scrollTop;let h='';
 if(S.tab==='ord')h=ordersView();else if(S.tab==='rep')h=reportView();else if(S.tab==='stf')h=staffView();else{
  if(S.tab==='mv')h+=chips([['in','استلام']].concat(OUT.map(x=>['o:'+x,'صرف: '+x])),S.mode==='in'?'in':'o:'+S.dest,'mode');
  else h+=chips([['open','فتح الأسبوع'],['count','جرد اليوم']],S.ct,'ct');
  h+='<input class="in" id="sq" type="search" placeholder="ابحث عن صنف" value="'+esc(S.q)+'">';
  const L=ITEMS.map((x,i)=>[x,i]).filter(x=>!S.q.trim()||x[0].includes(S.q.trim()));
  h+=L.map(([x,i])=>{if(S.tab==='cnt'){const r=LED[lid(S.ct,'',i)],ex=calc(i,S.d);return`<div class="row${r?' has':''}"><span class="nm">${esc(x)}<span class="sub">المتوقع ${ex}</span></span><input class="q w" inputmode="decimal" data-c="${i}" value="${r?r.q:''}" placeholder="${S.ct==='count'?ex:''}"></div>`}
   const t=S.mode==='in'?'in':'out',de=t==='out'?S.dest:'',v=getL(t,de,i);
   return`<div class="row${v?' has':''}"><span class="nm">${esc(x)}</span><span class="st"><button class="b" data-a="1" data-i="${i}">+</button><input class="q" inputmode="decimal" data-n="${i}" value="${v||''}" placeholder="0"><button class="b m" data-a="-1" data-i="${i}">−</button></span></div>`}).join('')}
 m.innerHTML=h;m.scrollTop=sc;
 const sq=$('sq');if(sq)sq.oninput=()=>{S.q=sq.value;const p=sq.selectionStart;adm();const z=$('sq');z.focus();z.setSelectionRange(p,p)}}
function staffView(){
 let h='<div class="card"><h3>إضافة موظف</h3><input class="in" id="sn" placeholder="الاسم" value="'+esc(S.sn||'')+'"><input class="in" id="sp" placeholder="الرقم السري (٦ خانات أو أكتر)" dir="ltr" value="'+esc(S.sp||'')+'">'+chips(FL.map(x=>[x,x==='كافيتيريا'?x:'دور '+x]),S.sf||'','sf')+'<button class="btn" id="sa" style="width:100%">إضافة</button></div>';
 FL.forEach(f=>{const L=STAFF.filter(x=>x.floor===f);if(L.length)h+='<h3>'+(f==='كافيتيريا'?f:'دور '+f)+'</h3>'+L.map(x=>`<div class="row"><span class="nm">${esc(x.name)}</span><button class="btn d" data-sd="${x.id}">حذف</button></div>`).join('')});
 return h}
function ordersView(){
 const P_=ORD.filter(o=>o.status==='pending').sort((a,b)=>(a.createdAt?.seconds||9e9)-(b.createdAt?.seconds||9e9));
 const D=ORD.filter(o=>o.status!=='pending').sort((a,b)=>(b.createdAt?.seconds||9e9)-(a.createdAt?.seconds||9e9)).slice(0,12);
 const card=(o,p)=>`<div class="card"><h3>${esc(o.name)} <span class="tag">${o.floor==='كافيتيريا'?o.floor:'دور '+esc(o.floor)}</span> <small>${o.date}</small></h3>`+Object.entries(o.items||{}).map(([i,v])=>`<div class="ln"><span>${esc(ITEMS[i])}</span>${p?`<input class="q s" inputmode="numeric" data-oe="${o.id}|${i}" value="${v}">`:'<b>'+v+'</b>'}</div>`).join('')+
  (p?`<div class="act"><button class="btn" data-ok="${o.id}">تأكيد</button><button class="btn d" data-no="${o.id}">رفض</button></div>`:`<div class="act"><span class="tag ${o.status==='confirmed'?'ok':'bad'}">${o.status==='confirmed'?'تم التأكيد':'مرفوض'}</span><button class="btn o" data-un="${o.id}">رجوع لمعلق</button></div>`)+'</div>';
 return(P_.length?(P_.length>1?'<div class="act"><button class="btn" data-okall="1">تأكيد الكل ('+P_.length+')</button></div>':'')+P_.map(o=>card(o,1)).join(''):'<div class="em">مفيش طلبات معلقة ✓</div>')+(D.length?'<h3>آخر الطلبات</h3>'+D.map(o=>card(o,0)).join(''):'')}
function wk(d){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()-(x.getDay()+1)%7);return iso(x)}
function addD(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return iso(x)}
function rng(){if(S.pm==='m'){const a=S.d.slice(0,7)+'-01',x=new Date(a+'T00:00:00');x.setMonth(x.getMonth()+1);x.setDate(0);return[a,iso(x)]}const a=wk(S.d);return[a,addD(a,6)]}
function wd(i,a,b){
 const rs=R().filter(r=>r.i===i&&r.d<=b);let od=null,ob=0;
 rs.forEach(r=>{if(r.t==='open'&&r.d>=a&&(od===null||r.d>=od)){od=r.d;ob=r.q}});
 if(od===null){let cd='';rs.forEach(r=>{if(r.t==='count'&&r.d<a&&r.d>=cd){cd=r.d;ob=r.q}})}
 const st=od===null?a:od,ps=rs.filter(r=>r.d>=st);let inn=0,out=0;const bf={};
 ps.forEach(r=>{if(r.t==='in')inn+=r.q;else if(r.t==='out'){out+=r.q;bf[r.de]=(bf[r.de]||0)+r.q}});
 let c=null;ps.forEach(r=>{if(r.t==='count'&&(!c||r.d>=c.d))c=r});
 let ex=ob+inn-out,df=null,cnt=null;
 if(c){let e2=ob;ps.forEach(r=>{if(r.d<=c.d){if(r.t==='in')e2+=r.q;else if(r.t==='out')e2-=r.q}});cnt=c.q;df=Math.round((c.q-e2)*100)/100}
 return{ob,inn,out,cnt,df,bf}}
function reportView(){
 const[a,b]=rng(),PS=[];let s0=a;while(s0<=b){const w=addD(wk(s0),6),e=w<b?w:b;PS.push([s0,e]);s0=addD(e,1)}
 const sum=(l,k)=>l.reduce((x,y)=>x+y[k],0);
 const D=ITEMS.map((n,i)=>{const ws=PS.map(p=>wd(i,p[0],p[1])),dfs=ws.filter(x=>x.df!==null),bf={};
  ws.forEach(x=>{for(const k in x.bf)bf[k]=(bf[k]||0)+x.bf[k]});
  return{n,ob:ws[0].ob,inn:sum(ws,'inn'),out:sum(ws,'out'),cnt:dfs.length?dfs[dfs.length-1].cnt:null,df:dfs.length?Math.round(sum(dfs,'df')*100)/100:null,bf}});
 const fl=S.rf!=='all';
 let L=D.filter(x=>fl?(x.bf[S.rf]||0)>0:(x.ob||x.inn||x.out||x.cnt!==null));
 if(S.only&&!fl)L=L.filter(x=>x.df);
 const bad=D.filter(x=>x.df).length,cn=D.filter(x=>x.cnt!==null).length;
 const fm=d=>d===null?'—':d<0?`<span class="bad">-${-d}</span>`:d>0?`<span class="ok">+${d}</span>`:'<span class="ok">✓</span>';
 const lab=S.pm==='m'?'شهر '+a.slice(0,7):'أسبوع '+a+' ← '+b;
 window._txt='تقرير '+lab+(fl?' - '+S.rf:'')+'\n'+L.map(x=>fl?x.n+': '+x.bf[S.rf]:x.n+': فتح '+x.ob+' / استلام '+x.inn+' / صرف '+x.out+' / جرد '+(x.cnt===null?'—':x.cnt)+' / فرق '+(x.df===null?'—':x.df)).join('\n');
 let h=chips([['w','أسبوعي'],['m','شهري']],S.pm,'pm')+`<div class="act" style="align-items:center;justify-content:space-between"><button class="chip" data-pn="-1">السابق ›</button><b>${lab}</b><button class="chip" data-pn="1">‹ التالي</button></div>`;
 h+=chips([['all','كل الأدوار']].concat(OUT.map(x=>[x,x])),S.rf,'rf');
 h+=`<p>تم جرد <b>${cn}</b> صنف، والفروقات في <b class="${bad?'bad':'ok'}">${bad}</b> صنف.</p><div class="act"><button class="btn${S.only?'':' o'}" data-f="1">${S.only?'عرض الكل':'الفروقات فقط'}</button><button class="btn o" data-cp="1">نسخ التقرير</button></div>`;
 h+=fl?'<div class="rt rt2 h"><span>الصنف</span><span>صرف '+esc(S.rf)+'</span></div>':'<div class="rt rt6 h"><span>الصنف</span><span>فتح</span><span>استلام</span><span>صرف</span><span>جرد</span><span>فرق</span></div>';
 h+=L.length?L.map(x=>fl?`<div class="rt rt2"><span>${esc(x.n)}</span><span>${x.bf[S.rf]}</span></div>`:`<div class="rt rt6"><span>${esc(x.n)}</span><span>${x.ob}</span><span>${x.inn}</span><span>${x.out}</span><span>${x.cnt===null?'—':x.cnt}</span><span>${fm(x.df)}</span></div>`).join(''):'<div class="em">مفيش حركة في الفترة دي.</div>';
 return h}

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 try{
 if(d.lf){LS.f=d.lf;LS.id='';loginView()}
 else if(d.ls){LS.id=d.ls;loginView()}
 else if(b.id==='lg'){const s=STF.find(x=>x.id===LS.id);try{await signInWithEmailAndPassword(auth,s.email,$('lpin').value)}catch(x){toast('الرقم السري غلط')}}
 else if(b.id==='lo2'){C={};await signOut(auth)}
 else if(d.sf){S.sn=$('sn').value;S.sp=$('sp').value;S.sf=d.sf;adm()}
 else if(b.id==='sa'){const name=$('sn').value.trim(),pin=$('sp').value.trim();if(!name||!S.sf||pin.length<6){toast('اكتب الاسم واختار الدور ورقم سري ٦ خانات على الأقل');return}
  b.disabled=true;const em='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'@buffet-staff.app';const sa=initializeApp(CFG,'sec'+Date.now());
  try{const au=getAuth(sa);const c=await createUserWithEmailAndPassword(au,em,pin);await setDoc(doc(db,'staff',c.user.uid),{name,floor:S.sf,email:em});await signOut(au);S.sn='';S.sp='';toast('تمت الإضافة ✓')}finally{deleteApp(sa);adm()}}
 else if(d.sd){await deleteDoc(doc(db,'staff',d.sd))}
 else if(b.id==='send')sendOrder();
 else if(b.id==='li'){try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)}catch(x){toast('الإيميل أو كلمة السر غلط')}}
 else if(b.id==='lo'){await signOut(auth);location.reload()}
 else if(d.tab){S.tab=d.tab;S.q='';adm()}
 else if(d.mode){if(d.mode==='in')S.mode='in';else{S.mode='out';S.dest=d.mode.slice(2)}adm()}
 else if(d.ct){S.ct=d.ct;adm()}
 else if(d.f){S.only=!S.only;adm()}
 else if(d.pm){S.pm=d.pm;adm()}
 else if(d.rf){S.rf=d.rf;adm()}
 else if(d.pn){const k=+d.pn,x=new Date(S.d+'T00:00:00');if(S.pm==='m'){x.setDate(1);x.setMonth(x.getMonth()+k)}else x.setDate(x.getDate()+7*k);S.d=iso(x);$('dt').value=S.d;adm()}
 else if(d.ok)await updateDoc(doc(db,'orders',d.ok),{status:'confirmed'});
 else if(d.no)await updateDoc(doc(db,'orders',d.no),{status:'rejected'});
 else if(d.un)await updateDoc(doc(db,'orders',d.un),{status:'pending'});
 else if(d.okall){for(const o of ORD.filter(o=>o.status==='pending'))await updateDoc(doc(db,'orders',o.id),{status:'confirmed'})}
 else if(d.cp){try{await navigator.clipboard.writeText(window._txt||'');toast('تم النسخ')}catch(x){toast('النسخ مش متاح')}}
 else if(d.a){const r=b.closest('.row'),inp=r.querySelector('.q'),i=+d.i;
  if(U&&!ADM){C[i]=Math.max(0,(C[i]||0)+ +d.a);inp.value=C[i]||'';r.classList.toggle('has',C[i]>0);const n=Object.values(C).reduce((a,c)=>a+c,0),s=$('send');s.disabled=!n;s.textContent=n?'إرسال الطلب ('+n+' قطعة)':'اختار الأصناف الأول'}
  else{const t=S.mode==='in'?'in':'out',de=t==='out'?S.dest:'',v=Math.max(0,getL(t,de,i)+ +d.a);inp.value=v||'';r.classList.toggle('has',v>0);await put(t,de,i,v)}}
 }catch(x){toast('حصل خطأ: '+(x.code||x.message))}});
document.addEventListener('change',async e=>{const el=e.target,v=el.value.trim()===''?'':parseFloat(el.value.replace(',','.')),dt=el.dataset;
 try{
 if(el.id==='dt'){S.d=el.value||S.d;adm()}
 else if(dt.oe){const[id,i]=dt.oe.split('|');await updateDoc(doc(db,'orders',id),{['items.'+i]:v>0?v:deleteField()})}
 else if(dt.n!==undefined){const i=+dt.n;if(!ADM){C[i]=v>0?v:0;emp()}else{const t=S.mode==='in'?'in':'out';await put(t,t==='out'?S.dest:'',i,v===''?0:v);el.closest('.row').classList.toggle('has',v>0)}}
 else if(dt.c!==undefined){await put(S.ct,'',+dt.c,v);el.closest('.row').classList.toggle('has',v!=='')}
 }catch(x){toast('حصل خطأ: '+(x.code||x.message))}});
